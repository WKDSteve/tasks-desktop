[package]
name = "hub-testkit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Test support for the tasks hub: the tasks hub as a subject of the security matrix, the fake tasks engine, and the tests that need a process"

[lints]
workspace = true

[lib]
name = "hub_testkit"
path = "src/lib.rs"

[[bin]]
name = "fake-nvim"
path = "src/bin/fake-nvim.rs"

[dependencies]
appkit-core.workspace = true
appkit-hub.workspace = true
appkit-testkit.workspace = true
tasks-hub = { path = "../tasks-hub" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tempfile = "3"

[dev-dependencies]
# What the hub sent to a phone is read as a phone reads it (RFC 8291, tests/push.rs): the versions appkit-hub brings.
p256 = { version = "0.14", default-features = false, features = ["ecdh", "std"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
