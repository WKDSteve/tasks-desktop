[package]
name = "tasks-hub"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local hub for tasks.nvim: engine trait, snapshot, queue, watch, routes"

[lints]
workspace = true

[lib]
name = "tasks_hub"
path = "src/lib.rs"

[[bin]]
name = "tasks-hub"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
appkit-core.workspace = true
# Web Push to the paired phones (src/server/push.rs) goes out through the kit's HTTP client.
appkit-hub = { workspace = true, features = ["push-net"] }
# The tasks hub as a paired device of the testing hub (src/testing_link.rs): the kit's client of a device, with its
# pairing link, its kept pairing and the confirmation of a trigger.
appkit-mobile.workspace = true
# The two keys of that pairing, kept in the settings folder: the versions appkit already brings.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
getrandom = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-core = "0.3"
# The stable line of notify; 9.0 is a release candidate (concept 7.1, 13.14).
notify = { version = "8.2", default-features = false }
# The scheduler of meeting notices and reminders at a time of day (src/schedule.rs): wall times of a zone to instants,
# with the time zone database bundled (Windows has no IANA database of its own; the same answers on every system).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
# The preview of a meeting (src/meetings.rs): its cover or the picture of a board, made 96 px small; PNG, JPEG and
# WebP only, no other decoder in the hub.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `rev` of a phone's snapshot, a hash over what it is given (src/server/device_cut.rs): the version appkit-hub brings.
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "net", "time", "macros", "io-util", "signal"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "test-util"] }
# Folders of the tests come from its `Scratch` (removed on drop). It depends on this crate; Cargo allows that cycle for
# dev-dependencies.
hub-testkit = { path = "../hub-testkit" }
# The invitation of a meeting (src/meetings.rs) is read back by an iCalendar parser of its own: `ical` (its one
# dependency is thiserror; icalendar and calcard bring chrono, which is unmaintained, RUSTSEC-2026-0543).
ical = { version = "0.11", default-features = false, features = ["ical"] }
# The subsystem in the header of the program (tests/window_program.rs).
appkit-testkit.workspace = true
