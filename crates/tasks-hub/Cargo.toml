[package]
name = "tasks-hub"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local hub for tasks.nvim: engine trait, snapshot, queue, watch, routes"

[lints]
workspace = true

[lib]
name = "tasks_hub"
path = "src/lib.rs"

[[bin]]
name = "tasks-hub"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
appkit-core.workspace = true
# Web Push to the paired phones (src/server/push.rs) goes out through the kit's HTTP client.
appkit-hub = { workspace = true, features = ["push-net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-core = "0.3"
# The stable line of notify; 9.0 is a release candidate (concept 7.1, 13.14).
notify = { version = "8.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "net", "time", "macros", "io-util", "signal"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
# Folders of the tests come from its `Scratch` (removed on drop). It depends on this crate; Cargo allows that cycle for
# dev-dependencies.
hub-testkit = { path = "../hub-testkit" }
