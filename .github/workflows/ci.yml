# CI of tasks-desktop.
#
# Runs on a self-hosted Windows runner of the maintainer (`runs-on: [self-hosted, windows]`). Without a running runner
# a push stays "Queued" (no red mark, discarded after 24 h). Only pushes to main of this repository start it: there is
# no `pull_request` trigger on purpose, because a pull request (from a fork, too) would run its own workflow with the
# maintainer's rights on that machine. Windows only: the Linux jobs of the former workflow (hub tests with inotify,
# install scripts under sh) are gone; ShellCheck runs on the runner.
#
# The other sources (tasks.nvim and lib.nvim at the pinned commits of engine.lock, appkit through Cargo and pnpm) are
# public and fetched without credentials.
# Tools (cargo, clippy, rustfmt, cargo-audit, cargo-deny, nvim, pnpm, python, Chrome) are expected on the PATH and not
# pinned here; the jobs print their versions.

name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A missing engine is a failure in CI, not a skipped test.
  TASKS_DESKTOP_REQUIRE_ENGINE: "1"
  TASKS_ENGINE_DIR: ${{ github.workspace }}/engine/tasks.nvim
  LIB_NVIM_DIR: ${{ github.workspace }}/engine/lib.nvim

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  rust:
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      # Actions are pinned by commit (concept 7.4); the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The pins must exist: a typo in engine.lock fails here, not later.
      - name: Fetch the pinned engine (tasks.nvim) and lib.nvim
        run: |
          commit="$(sed -n 's/^commit *= *//p' engine.lock)"
          lib_commit="$(sed -n 's/^lib_commit *= *//p' engine.lock)"
          rm -rf engine
          mkdir engine
          git clone --quiet https://github.com/WKDSteve/tasks.nvim engine/tasks.nvim
          git -C engine/tasks.nvim checkout --quiet "$commit"
          git clone --quiet https://github.com/WKDSteve/lib.nvim engine/lib.nvim
          git -C engine/lib.nvim checkout --quiet "$lib_commit"
      - run: nvim --version | head -n1 && cargo --version && pnpm --version
      # The types of the UI are the engine's, copied: a change of the
      # contract that did not reach the UI fails here.
      - name: UI contract types equal the engine's
        run: cmp engine/tasks.nvim/schemas/tasks-export/1/tasks-export.d.ts ui/src/lib/contract.d.ts
      # The golden sheet block is a contract with testing.nvim: the copy here is the file at the pinned commit
      # (ui/src/lib/fixtures/sheet-block.source), byte for byte, with its checksum file.
      - name: Golden sheet block equals testing.nvim's at the pinned commit
        shell: bash
        run: |
          sha="$(awk '{print $2}' ui/src/lib/fixtures/sheet-block.source)"
          base="https://raw.githubusercontent.com/WKDSteve/testing.nvim/${sha}/TESTS/golden/sheet-block"
          curl -fsSL "${base}/sheet-block.golden.md" -o "${RUNNER_TEMP}/golden.md"
          curl -fsSL "${base}/SHA256" -o "${RUNNER_TEMP}/golden.sha"
          cmp "${RUNNER_TEMP}/golden.md" ui/src/lib/fixtures/sheet-block.golden.md
          cmp "${RUNNER_TEMP}/golden.sha" ui/src/lib/fixtures/sheet-block.SHA256

      # The interface is part of the binary: it is built first.
      - name: Build the interface
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # The engine of the web variant: tasks.nvim in wasmoon (Lua 5.4) must answer every read method byte for byte as
      # nvim does on the pinned commits (ui/web/engine.test.mjs).
      #
      # The Node and browser steps run through tools/run-with-temp.mjs: the command gets a temp dir of its own, empty at
      # the start, and the step fails when a test left a folder of its own in it (`tasks-desktop-*`, `tasks-web-*`; the
      # tests get theirs from ui/web/tmp.mjs, which removes them also after a failure). Not strict: Chrome, Playwright and
      # Node keep caches in the temp dir (chrome_chrome_url_fetcher_*, playwright-transform-cache, node-compile-cache)
      # that are theirs and not the tests'. Rust is checked strict, below.
      - name: Web engine against nvim
        working-directory: ui
        env:
          TASKS_WEB_COMPARE: "1"
        run: node ../tools/run-with-temp.mjs -- pnpm web:test
      # The page of the web variant as one file: built, opened from disk in Chrome (the project of ui/playwright.web.config.ts,
      # tests in ui/e2e-web/), the engine started in its worker, a folder chosen (a fake one, the same fixture vault and the
      # same hostile tasks as the hub's browser tests below): the overview, a task, the search, the filters, the plan, the
      # check, accessibility, writing with its conflict check, and what the data classes keep in IndexedDB. Every test holds
      # the page to the same two rules: not one request, not one violation of its own policy.
      # Firefox and WebKit are Playwright's own builds (the read only way in and the record of the browser APIs run there,
      # ui/playwright.web.config.ts). They live in the tool cache of the runner, not in %LOCALAPPDATA%: a runner started from
      # a program that redirects AppData (the Claude app) gets a Firefox whose side-by-side assembly Windows cannot find.
      # A second install is a no-op.
      - name: Firefox and WebKit for the web page
        working-directory: ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: pnpm exec playwright install firefox webkit
      - name: Web page (one file) in Chrome, Firefox and WebKit from disk, without a request
        working-directory: ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: |
          pnpm web:build
          node ../tools/run-with-temp.mjs -- pnpm web:e2e
      # The tests of this job get a temp dir of its own, empty at the start: the shared one of the runner (the author's
      # machine) holds the leftovers of every earlier run, 24918 folders at the last count, and of other jobs, so a count
      # in it would never be zero. TEMP and TMP are read on Windows, TMPDIR elsewhere. `New-Item` fails when the folder is
      # there already, so "empty at the start" is checked, not assumed. The check that counts what is in it runs after
      # `cargo test`. It starts after the web steps above, which have temp dirs of their own (see there): those run Node
      # tools and Chrome with caches in the temp dir, and a strict count would take them for the tests' leftovers.
      - name: Temp dir of this job
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "job-temp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          "TEMP=$dir", "TMP=$dir", "TMPDIR=$dir", "JOB_TEMP=$dir" | Add-Content -Path $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # No test leaves a folder in the temp dir of this job (a test makes its folder with `Scratch`, which removes it
      # also after a failure). Strict: whatever name a test gave its folder counts; `nvim` and `nvim.0` are what the real
      # Neovim of the engine tests makes itself. The browser tests below have their own check (run-with-temp.mjs).
      - name: The tests left nothing in the temp dir
        run: node tools/check-temp-leftovers.mjs --dir "$JOB_TEMP" --strict --allow nvim --allow nvim.0
      # The install and uninstall scripts (NREL-16) against this build, in folders of their own:
      # the login entry and the link of the runner are left alone, nothing is downloaded. Each script makes a folder of its
      # own in the temp dir (`tasks-desktop-test-install-*`) and removes it when it is over; they run through
      # tools/run-with-temp.mjs, so a folder that stays (a failed removal) fails the step. The strict count of the job
      # above ran before them and would never have seen it.
      - name: Install and uninstall scripts (PowerShell and sh)
        run: |
          node tools/run-with-temp.mjs -- pwsh -NoProfile -File scripts/test-install.ps1 target/debug/tasks-hub.exe
          node tools/run-with-temp.mjs -- sh scripts/test-install.sh target/debug/tasks-hub.exe
      - name: PSScriptAnalyzer on the scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          # Import by version too: autoloading would take the newest copy on the runner, not the pinned one.
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          (Get-Module PSScriptAnalyzer).Version
          $found = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning)
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }
      # The browser tests: the binary, the real engine, the system's Chrome. Each run takes a free port (e2e/port.ts): the
      # runner is the author's machine, where runs in a terminal and of other sessions take theirs.
      - name: Browser tests (Playwright, axe, XSS corpus)
        working-directory: ui
        run: node ../tools/run-with-temp.mjs -- pnpm e2e
      # A failed browser test leaves its trace (network, DOM, console) to read instead of a guess.
      - name: Traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: playwright-traces
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 14
      # The supply chain (concept 7.4): known advisories, licenses, sources.
      - run: cargo audit
      - run: cargo deny check
      # No crate version younger than a week (a hijacked release is caught
      # within hours, usually; see tools/check-lock-age.py).
      - run: python tools/check-lock-age.py --min-days 7
      # appkit is the one git source: the commit Cargo.lock pins must be the one its tag names now.
      - run: python tools/check-appkit-pin.py

  ui:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The lockfile is the truth; the age and trust policy are in
      # ui/pnpm-workspace.yaml. pnpm is the runner's own (a global install would change this machine on every run).
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The same temp dir of its own and the same count as for the browser tests above (tools/run-with-temp.mjs).
      - run: node ../tools/run-with-temp.mjs -- pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

  # A control or invisible character in a tracked text file (a backspace in a
  # path, a bidirectional override in source) is refused; the tool tests itself.
  hygiene:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python -m unittest discover tools
      # The leftover check of the temp dir (tools/check-temp-leftovers.mjs) tests itself, and ci.yml is held to run it.
      - run: node --test "tools/*.test.mjs"
      - run: python tools/check-control-chars.py
      # A colour the CSS of the page states is a token of appkit-ui (the same check runs in appkit).
      - run: python tools/check-color-literals.py
      # The shell scripts of the repository (NREL-16): ShellCheck is on the runner (`scoop install shellcheck`).
      - run: shellcheck scripts/*.sh
