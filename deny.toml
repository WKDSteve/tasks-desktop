# cargo-deny: what may enter the dependency tree (concept 7.4, risk T7).
# Run: cargo deny check

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates are errors.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    # notify (the file watcher) is CC0-1.0, a public domain dedication, and
    # its Linux backend inotify is ISC, a permissive license like MIT.
    "CC0-1.0",
    "ISC",
    # webpki-roots (the Mozilla roots of the TLS of Web Push, appkit-hub's push-net; a list of certificates, no code)
    # is under the Community Data License Agreement, Permissive 2.0: use and share freely, keep the notice.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared foundation of the hub, by tag; tools/check-appkit-pin.py checks the pinned commit.
allow-git = ["https://github.com/WKDSteve/appkit"]
